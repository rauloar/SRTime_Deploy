# ============================================================
# SRTime — Reverse proxy nginx
# El instalador reemplaza __SERVER_NAME__ por la IP/dominio del servidor
# y copia este archivo al sitio de nginx del SO (Debian: sites-available,
# Arch/Manjaro: /etc/nginx/conf.d/).
# ============================================================
server {
    listen 80;
    server_name __SERVER_NAME__;

    access_log /var/log/srtime/nginx-access.log;
    error_log  /var/log/srtime/nginx-error.log;

    # Tamaño máximo de uploads (50 MB para archivos de asistencia)
    client_max_body_size 10M;

    # Headers de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # FastAPI sirve tanto /api como el export estático de Next.js.
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
